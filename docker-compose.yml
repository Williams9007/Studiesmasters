version: "3.8"

services:
  backend:
    build: ./Studiesmasters-backend
    ports:
      - "5000:5000"
    env_file:
      - ./Studiesmasters-backend/.env
    volumes:
      - backend-logs:/app/logs
      - backend-uploads:/app/uploads
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build: ./studiesmasters-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend-logs:
  backend-uploads: