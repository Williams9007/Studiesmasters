name: CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  # ==========================
  # BACKEND TESTS
  # ==========================
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: Studiesmasters-backend/package-lock.json

      - name: Install backend dependencies
        working-directory: Studiesmasters-backend
        run: npm ci

      - name: Run security audit
        working-directory: Studiesmasters-backend
        run: npm audit --audit-level=high

      - name: Check for syntax errors
        working-directory: Studiesmasters-backend
        run: node --check server.js

  # ==========================
  # FRONTEND BUILD
  # ==========================
  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: studiesmasters-frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: studiesmasters-frontend
        run: npm ci

      - name: Build frontend
        working-directory: studiesmasters-frontend
        run: npm run build
        env:
          VITE_API_URL: https://studiesmasters-backend.onrender.com

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: studiesmasters-frontend/dist/
          retention-days: 7

  # ==========================
  # SECURITY SCAN
  # ==========================
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build]

    steps:
      - uses: actions/checkout@v4

      - name: Run npm audit on backend
        working-directory: Studiesmasters-backend
        run: npm audit --audit-level=moderate || true

      - name: Run npm audit on frontend
        working-directory: studiesmasters-frontend
        run: npm audit --audit-level=moderate || true

  # ==========================
  # DEPLOY (only on main branch)
  # ==========================
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build, security-scan]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    environment: production

    steps:
      - name: Deploy to Render
        run: |
          echo "🚀 Deploying to Render..."
          echo "Set up Render deploy hook in your repository secrets"
          echo "RENDER_DEPLOY_HOOK_URL=https://api.render.com/deploy/your-hook-url"